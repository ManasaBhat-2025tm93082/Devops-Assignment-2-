# Rolling update: replaces pods gradually, zero downtime (maxUnavailable: 0).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-rolling
  labels: {app: aceest-rolling}
spec:
  replicas: 4
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: aceest-rolling}
  template:
    metadata:
      labels: {app: aceest-rolling}
    spec:
      containers:
        - name: aceest
          image: DOCKERHUB_USER/aceest-fitness:1.0.0
          ports: [{containerPort: 5000}]
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-rolling
spec:
  type: NodePort
  selector: {app: aceest-rolling}
  ports: [{port: 80, targetPort: 5000, nodePort: 30081}]
