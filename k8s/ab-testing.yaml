# A/B testing: requests with header "X-Variant: B" go to version 2.0.0, all others to 1.0.0.
# Needs the NGINX ingress controller (minikube addons enable ingress).
apiVersion: apps/v1
kind: Deployment
metadata: {name: aceest-ab-a}
spec:
  replicas: 2
  selector:
    matchLabels: {app: aceest-ab, variant: a}
  template:
    metadata:
      labels: {app: aceest-ab, variant: a}
    spec:
      containers:
        - name: aceest
          image: DOCKERHUB_USER/aceest-fitness:1.0.0
          ports: [{containerPort: 5000}]
          readinessProbe:
            httpGet: {path: /health, port: 5000}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: aceest-ab-b}
spec:
  replicas: 2
  selector:
    matchLabels: {app: aceest-ab, variant: b}
  template:
    metadata:
      labels: {app: aceest-ab, variant: b}
    spec:
      containers:
        - name: aceest
          image: DOCKERHUB_USER/aceest-fitness:2.0.0
          ports: [{containerPort: 5000}]
          readinessProbe:
            httpGet: {path: /health, port: 5000}
---
apiVersion: v1
kind: Service
metadata: {name: aceest-ab-a}
spec:
  selector: {app: aceest-ab, variant: a}
  ports: [{port: 80, targetPort: 5000}]
---
apiVersion: v1
kind: Service
metadata: {name: aceest-ab-b}
spec:
  selector: {app: aceest-ab, variant: b}
  ports: [{port: 80, targetPort: 5000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-main
spec:
  ingressClassName: nginx
  rules:
    - host: ab.aceest.local
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: aceest-ab-a, port: {number: 80}}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-variant-b
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Variant"
    nginx.ingress.kubernetes.io/canary-by-header-value: "B"
spec:
  ingressClassName: nginx
  rules:
    - host: ab.aceest.local
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: aceest-ab-b, port: {number: 80}}}}
