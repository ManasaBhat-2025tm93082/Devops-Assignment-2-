# Blue-Green: two full environments run side by side. The Service selector decides which one
# receives traffic. Switch (and roll back) instantly with scripts/switch-blue-green.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  labels: {app: aceest-bg, slot: blue}
spec:
  replicas: 2
  selector:
    matchLabels: {app: aceest-bg, slot: blue}
  template:
    metadata:
      labels: {app: aceest-bg, slot: blue}
    spec:
      containers:
        - name: aceest
          image: DOCKERHUB_USER/aceest-fitness:1.0.0
          ports: [{containerPort: 5000}]
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  labels: {app: aceest-bg, slot: green}
spec:
  replicas: 2
  selector:
    matchLabels: {app: aceest-bg, slot: green}
  template:
    metadata:
      labels: {app: aceest-bg, slot: green}
    spec:
      containers:
        - name: aceest
          image: DOCKERHUB_USER/aceest-fitness:2.0.0
          ports: [{containerPort: 5000}]
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-bg
spec:
  type: NodePort
  selector: {app: aceest-bg, slot: blue}   # change to "green" to cut over
  ports: [{port: 80, targetPort: 5000, nodePort: 30082}]
